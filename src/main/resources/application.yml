spring:
  application:
    name: realtime-auction-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auction_db}
    username: ${DB_USERNAME:auction_user}
    password: ${DB_PASSWORD:auction_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-key-change-me-now}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap:
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-password: ${APP_ADMIN_PASSWORD:}
    admin-name: ${APP_ADMIN_NAME:Auction Admin}
  auction:
    scheduler-delay-ms: ${AUCTION_SCHEDULER_DELAY_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
